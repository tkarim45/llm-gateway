[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-gateway"
version = "0.1.0"
description = "Production LLM API gateway — API-key auth, per-tenant rate limiting + token quotas, ordered provider failover (Bedrock -> Anthropic), SSE streaming passthrough, per-tenant cost metering, append-only audit log"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Taimour Abdul Karim", email = "taimour.a.karim@gmail.com" }]
keywords = ["llm", "gateway", "api-gateway", "rate-limiting", "failover", "cost-tracking", "llmops", "bedrock"]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2",
  "anthropic[bedrock]>=0.40",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
